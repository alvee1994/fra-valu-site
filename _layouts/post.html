---
layout: default
---
<section class="post">
  <div class="wrap">
    <a class="post-back" href="{{ '/posts/' | relative_url }}">&larr; All posts</a>
    <article>
      <p class="label">{{ page.date | date: "%-d %B %Y" }}</p>
      <h1>{{ page.title }}</h1>
      {{ content }}
    </article>
  </div>
</section>
