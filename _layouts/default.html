<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}{% unless page.url == '/' %} · Fravalu{% endunless %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg transform='rotate(-18 50 50)'%3E%3Cpolygon points='97,50 6,10 6,42 64,50 6,58 6,90' fill='%23F4C542'/%3E%3Cpolygon points='97,50 6,58 6,90' fill='%23C89A2C'/%3E%3C/g%3E%3C/svg%3E">
  <!-- Open Props: vendored locally (no build step here), same reasoning as the
     old gsap.min.js used to get — a CDN copy is one more thing a content
     blocker can drop. Normalize first, then the token set. -->
  <link rel="stylesheet" href="{{ '/open-props.normalize.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/open-props.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>

<body>

  <header>
    <div class="wrap nav">
      <a class="mark" href="{{ '/' | relative_url }}#top">
        <svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true" style="flex:none">
          <g transform="rotate(-18 50 50)">
            <polygon points="97,50 6,10 6,42 64,50 6,58 6,90" fill="#F4C542"></polygon>
            <polygon points="97,50 6,58 6,90" fill="#C89A2C"></polygon>
          </g>
        </svg>
        <span>fravalu</span>
      </a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}#intro">What I do</a>
        <a href="{{ '/notes/' | relative_url }}">Notes</a>
        <a class="btn btn-primary" href="{{ '/' | relative_url }}#book">Schedule a call</a>
      </nav>
    </div>
  </header>

  <main id="top">
    {{ content }}
  </main>

  <footer>
    <div class="wrap foot">
      <div>
        <a class="mark" href="{{ '/' | relative_url }}#top" style="margin-bottom:12px">
          <svg viewBox="0 0 100 100" width="22" height="22" aria-hidden="true" style="flex:none">
            <g transform="rotate(-18 50 50)">
              <polygon points="97,50 6,10 6,42 64,50 6,58 6,90" fill="#F4C542"></polygon>
              <polygon points="97,50 6,58 6,90" fill="#C89A2C"></polygon>
            </g>
          </svg>
          <span>fravalu</span>
        </a>
        <p style="margin:0;max-width:36ch">AI and workflow automation for SMEs. Rotterdam, Netherlands.</p>
      </div>
      <div class="foot-meta">
        <div><a href="mailto:contact@fra-valu.com">contact@fra-valu.com</a></div>
        <div><a href="https://www.linkedin.com/in/alveeahmed/" rel="me noopener"
            target="_blank">linkedin.com/in/alveeahmed</a></div>
        <div>KVK 42095902</div>
      </div>
    </div>
  </footer>

</body>

</html>
